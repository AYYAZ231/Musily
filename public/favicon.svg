<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A102F"/>
      <stop offset="100%" stop-color="#090B10"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#neonGrad)" stroke-width="8" stroke-opacity="0.4"/>
  
  <!-- Outer Vinyl Glow Ring -->
  <circle cx="256" cy="256" r="170" stroke="url(#neonGrad)" stroke-width="12" stroke-dasharray="12 8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="140" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="110" stroke="#FFFFFF" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="256" r="80" stroke="#FFFFFF" stroke-width="2" opacity="0.1"/>

  <!-- Center Music Note & Party Sound Wave -->
  <circle cx="256" cy="256" r="54" fill="url(#neonGrad)" />
  <path d="M244 210 L274 195 L274 275 A20 20 0 1 1 244 265 L244 210 Z" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="12" fill="#090B10"/>

  <!-- Aux Sound Wave bars -->
  <rect x="76" y="240" width="8" height="32" rx="4" fill="#06B6D4" opacity="0.8"/>
  <rect x="92" y="220" width="8" height="72" rx="4" fill="#8B5CF6" opacity="0.9"/>
  <rect x="108" y="200" width="8" height="112" rx="4" fill="#EC4899" opacity="0.9"/>
  
  <rect x="396" y="200" width="8" height="112" rx="4" fill="#EC4899" opacity="0.9"/>
  <rect x="412" y="220" width="8" height="72" rx="4" fill="#8B5CF6" opacity="0.9"/>
  <rect x="428" y="240" width="8" height="32" rx="4" fill="#06B6D4" opacity="0.8"/>
</svg>
